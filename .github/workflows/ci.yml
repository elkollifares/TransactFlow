name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore TransactFlow.sln --configfile NuGet.Config
      - run: dotnet build TransactFlow.sln --configuration Release --no-restore
      - run: dotnet run --project tests/TransactFlow.DomainTests --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/TransactFlow.Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/TransactFlow.Web/package-lock.json
      - run: npm ci
      - run: npm run build

